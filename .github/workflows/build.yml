name: Build Agent

on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pyngrok requests

      - name: Build Windows executable
        run: pyinstaller --onefile agent.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: dist/agent.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pyngrok requests

      - name: Build macOS executable
        run: pyinstaller --onefile agent.py

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: agent-mac
          path: dist/agent

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pyngrok requests

      - name: Build Linux executable
        run: pyinstaller --onefile agent.py

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: dist/agent